name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

      - name: Run Strict Mypy
        run: mypy src tests

  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: lint-and-typecheck
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Suite
        run: pytest -v --tb=short

  build-smoke:
    name: Build & Package Smoke Test (Isolated Venv)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build "setuptools==77.0.3" "wheel>=0.40.0"

      - name: Build wheel and sdist (no-isolation)
        run: python -m build --no-isolation

      - name: Build wheel and sdist (isolated)
        run: python -m build

      - name: Fresh-Venv Isolated Wheel Installation & Verification
        run: |
          python -m venv /tmp/smoke_wheel_venv
          /tmp/smoke_wheel_venv/bin/pip install --upgrade pip
          /tmp/smoke_wheel_venv/bin/pip install dist/*.whl
          /tmp/smoke_wheel_venv/bin/pip install build pytest pytest-cov
          # Run import verification outside of source repository
          cd /tmp
          /tmp/smoke_wheel_venv/bin/python -c "import memory_aware_agent_harness as m; print(f'Wheel Version: {m.__version__} from {m.__file__}'); assert 'site-packages' in m.__file__, f'Imported {m.__file__} not from site-packages!'"
          /tmp/smoke_wheel_venv/bin/python -c "from memory_aware_agent_harness.contracts import MemoryRecord, RunStatus; print('Contracts imported successfully from wheel')"
          /tmp/smoke_wheel_venv/bin/python -c "from memory_aware_agent_harness.doubles import DeterministicClock; c = DeterministicClock(); print(f'Clock double initialized: {c.now()}')"
          /tmp/smoke_wheel_venv/bin/python -c "from memory_aware_agent_harness.validation import validate_memory_record; print('Validation imported successfully from wheel')"
          /tmp/smoke_wheel_venv/bin/python -c "import importlib.resources as r; assert (r.files('memory_aware_agent_harness') / 'py.typed').is_file(), 'py.typed marker missing from installed wheel!'"
          # Run repository-layout packaging tests separately
          /tmp/smoke_wheel_venv/bin/pytest "$GITHUB_WORKSPACE/tests/packaging" -v -o pythonpath="" --import-mode=importlib --no-cov
          # Run full applicable test suite against installed distribution in isolated environment
          /tmp/smoke_wheel_venv/bin/pytest "$GITHUB_WORKSPACE/tests" -v -o pythonpath="" --import-mode=importlib

      - name: Fresh-Venv Isolated Sdist Installation & Verification
        run: |
          python -m venv /tmp/smoke_sdist_venv
          /tmp/smoke_sdist_venv/bin/pip install --upgrade pip
          /tmp/smoke_sdist_venv/bin/pip install dist/*.tar.gz
          /tmp/smoke_sdist_venv/bin/pip install build pytest pytest-cov
          # Run import verification outside of source repository
          cd /tmp
          /tmp/smoke_sdist_venv/bin/python -c "import memory_aware_agent_harness as m; print(f'Sdist Version: {m.__version__} from {m.__file__}'); assert 'site-packages' in m.__file__, f'Imported {m.__file__} not from site-packages!'"
          /tmp/smoke_sdist_venv/bin/python -c "from memory_aware_agent_harness.contracts import MemoryRecord, RunStatus; print('Contracts imported successfully from sdist')"
          /tmp/smoke_sdist_venv/bin/python -c "from memory_aware_agent_harness.doubles import DeterministicClock; c = DeterministicClock(); print(f'Clock double initialized: {c.now()}')"
          /tmp/smoke_sdist_venv/bin/python -c "from memory_aware_agent_harness.validation import validate_memory_record; print('Validation imported successfully from sdist')"
          /tmp/smoke_sdist_venv/bin/python -c "import importlib.resources as r; assert (r.files('memory_aware_agent_harness') / 'py.typed').is_file(), 'py.typed marker missing from installed sdist!'"
          # Run repository-layout packaging tests separately
          /tmp/smoke_sdist_venv/bin/pytest "$GITHUB_WORKSPACE/tests/packaging" -v -o pythonpath="" --import-mode=importlib --no-cov
          # Run full applicable test suite against installed distribution in isolated environment
          /tmp/smoke_sdist_venv/bin/pytest "$GITHUB_WORKSPACE/tests" -v -o pythonpath="" --import-mode=importlib
