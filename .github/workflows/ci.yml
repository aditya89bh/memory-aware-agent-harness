name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

      - name: Run Strict Mypy
        run: mypy src tests

  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: lint-and-typecheck
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Suite
        run: pytest -v --tb=short

  build-smoke:
    name: Build & Package Smoke Test (Isolated Venv)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Fresh-Venv Isolated Wheel Installation & Verification
        run: |
          python -m venv /tmp/smoke_venv
          /tmp/smoke_venv/bin/pip install --upgrade pip
          /tmp/smoke_venv/bin/pip install dist/*.whl
          # Run import verification outside of source repository
          cd /tmp
          /tmp/smoke_venv/bin/python -c "import memory_aware_agent_harness as m; print(f'Version: {m.__version__}')"
          /tmp/smoke_venv/bin/python -c "from memory_aware_agent_harness.contracts import MemoryRecord, RunStatus; print('Contracts imported successfully')"
          /tmp/smoke_venv/bin/python -c "from memory_aware_agent_harness.doubles import DeterministicClock; c = DeterministicClock(); print(f'Clock double initialized: {c.now()}')"
          /tmp/smoke_venv/bin/python -c "import importlib.resources as r; assert (r.files('memory_aware_agent_harness') / 'py.typed').is_file(), 'py.typed marker missing from installed wheel!'"
